name: registry

# 自动收录 CI：定时重跑 build-index，刷新 marketplace/index.json（jsDelivr CDN 静态索引）
# 手动触发：仓库 Actions 页 → registry → Run workflow

on:
  schedule:
    # 每 6 小时一次；GitHub cron 使用 UTC
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: registry-index
  cancel-in-progress: false

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          # 本仓库无 npm 依赖（build-index 只用 node 内置模块 + gh CLI），无需 cache: npm
          node-version: 22

      - name: Build plugin index
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/build-index.cjs --limit=500

      - name: Build skills index
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/build-index.cjs --skills --limit=300

      - name: Commit & push if changed
        run: |
          # 用仓库主人身份提交（避免 Contributors 列表出现 github-actions[bot]）
          git config user.name "Noob-stupid"
          git config user.email "1528154168@qq.com"
          git add marketplace/index.json
          if git diff --cached --quiet; then
            echo "index unchanged, nothing to commit"
          else
            git commit -m "chore: refresh marketplace index"
            # 并发防撞：远端被推进时 fetch + rebase 重试（最多 5 次），避免 fetch first 冲突失败
            for i in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then
                echo "index pushed (attempt $i)"
                exit 0
              fi
              echo "push attempt $i failed, waiting 5s before retry..."
              sleep 5
            done
            echo "push failed after 5 attempts"
            exit 1
          fi
