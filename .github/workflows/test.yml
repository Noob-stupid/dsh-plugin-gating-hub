name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # CI 模式：跳过需要真实网络/本机 profile 的断言，避免环境因素误红
      DSH_TEST_SKIP_NETWORK: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Syntax check (hard gate)
        run: |
          node --check lib/index.js
          node --check lib/client.js
          for f in test-*.mjs; do node --check "$f"; done

      - name: Unit tests (hard gate)
        run: |
          node test-compat-gate.mjs
          node test-compat-soft-lock.mjs
          node test-preflight-guard.mjs
          node test-format-preflight.mjs
          node test-clean-residuals.mjs
          node test-quarantine-merge.mjs
          node test-route-inventory.mjs
          node test-suite-detect.mjs
          node test-format-contract.mjs
          node test-framework-versions.mjs
          node test-architecture-guard.mjs
          node test-skill-toggle.mjs
          node test-harness.mjs

      # 真装真卸冒烟：在 CI 的 Linux 宿主上跑（临时 DSH_HOME，不碰真实目录）。
      # 为什么单独一步且**不带** DSH_TEST_SKIP_NETWORK：环境相关测试"没 profile 就整体 SKIP"，
      # 正是这个缺口让 `git.exe`、corepack Windows 路径这类硬编码在 Linux CI 上一直活着（2026-09-20 复盘）。
      - name: Real install/uninstall smoke (temp DSH_HOME)
        env:
          DSH_TEST_SKIP_NETWORK: ''
        run: node test-install-smoke.mjs

      - name: Environment-dependent tests (auto-SKIP without local profile)
        run: |
          node test-framework-upgrade.mjs
          node test-bundle-guard.mjs
          node test-issue15-resolve.mjs
          node test-suite-install.mjs
          node test-registry-scan.mjs
          node test-preset-migration.mjs
          node test-upgrade-script-syntax.mjs
          node test-preflight-disable.mjs
