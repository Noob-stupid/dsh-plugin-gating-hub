name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # CI 模式：跳过需要真实网络/本机 profile 的断言，避免环境因素误红
      DSH_TEST_SKIP_NETWORK: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Syntax check (hard gate)
        run: |
          node --check lib/index.js
          node --check lib/client.js
          for f in tests/test-*.mjs; do node --check "$f"; done

      - name: Unit tests (hard gate)
        run: |
          node tests/test-compat-gate.mjs
          node tests/test-compat-soft-lock.mjs
          node tests/test-preflight-guard.mjs
          node tests/test-format-preflight.mjs
          node tests/test-clean-residuals.mjs
          node tests/test-quarantine-merge.mjs
          node tests/test-route-inventory.mjs
          node tests/test-suite-detect.mjs
          node tests/test-format-contract.mjs
          node tests/test-framework-versions.mjs
          node tests/test-architecture-guard.mjs
          node tests/test-skill-toggle.mjs
          node tests/test-harness.mjs
          node tests/test-pnpm-kill-tree.mjs
          node tests/test-killtree-wait.mjs
          node tests/test-trash-fallback.mjs
          node tests/test-pnpm-env.mjs
          # 0.5.23 改错+加法（2026-09-27）：桌面端实例"所有 pnpm 操作跑不了"两处根因——
          # ① cmd-corepack 的命令串被 Node 转义成 \"corepack\"（cmd 解析不到，本套 ⑥ 用真 cmd.exe 做负/正对照）
          # ② 认不出桌面端自带运行时（<resources>\runtime\pnpm\bin\pnpm.mjs + execPath/--expose-internals）
          # 全离线可跑（唯一用到真 cmd.exe 的 ⑥ 在非 win32 上如实 SKIP）；含既有候选与兜底语义的回归断言
          node tests/test-pnpm-runners.mjs
          # 0.5.43 改错（2026-10-08）：**执行方式按目标 profile 声明的 pnpm 版本选**。
          # 现场：resolvePnpmRunners() 先命中 node-corepack（corepack 默认 11.21.0），而 desktop profile
          # 的 node_modules 是桌面端自带运行时那份 pnpm（11.7.0）建的（.modules.yaml: packageManager）
          # ⇒ 版本错配 ⇒ 重导 @deepseek-ai 的包 ⇒ Windows rename 覆盖已存在目录 ERR_PNPM_EPERM
          # ⇒ 卡满 120s 超时被杀 + 留 *_tmp_<pid>_<n> 僵尸目录；匹配那份 0.8–1.4 秒成功。
          # 全离线：正控（声明 11.7.0 ⇒ 桌面端那份）/ 负控（声明 11.21.0 ⇒ corepack 那份）/
          # 无 .modules.yaml ⇒ 逐项等于既有顺序（不倒退）/ 版本读不出来者永不提升 / 平局不搬家 /
          # 接线（runPnpmWithFallback 的首选 === 选择器的首选，正负控各一次）。
          # 真机只读判据：本机有 desktop profile 时读它声明的版本（**不跑 pnpm、不写 profile**），
          # 看不到桌面端运行时候选（普通 node 无 resourcesPath）时**响亮 SKIP**，不假装 PASS。
          node tests/test-pnpm-runner-pick.mjs
          node tests/test-install-diagnose.mjs
          node tests/test-install-verify.mjs
          node tests/test-upgrade-script-blocks.mjs
          node tests/test-lockfile-health.mjs
          node tests/test-manifest-declare.mjs
          # 0.5.20 改错+加法（2026-09-27）：非 registry 包按 link: 写回（写回形态 / lock 对账 /
          # 文案与实际一致 / **真 pnpm** 断言"随后 pnpm install --lockfile-only 退出码 0"，不出外网）
          node tests/test-dep-pin.mjs
          # 0.5.20 加法：结构化「建议动作」的契约 + 拒绝任意命令（400 且一次都没执行）+
          # 客户端执行框的离线渲染断言（有/无、执行中、成功、失败、中英切换）
          # 0.5.24 加法：A-③ 的**真 pnpm** 证据（pnpm 自己产出 ERR_PNPM_IGNORED_BUILDS → ok=true、exitCode 如实）
          #          + 选项 2 的第二个动作按钮渲染断言；pnpm 不可用时该组响亮 SKIP
          node tests/test-plugin-actions.mjs
          # 0.5.24 加法（选项 2）：显式动作「允许这些构建脚本」——最小改动 + 改前备份 + 写后读回核实 +
          # 未点击时文件 sha256 不变（负例）+ 绝不 exec/spawn（源码级安全边界）；全离线
          node tests/test-allow-builds.mjs
          # 批次 A-①（2026-09-27）：git 克隆的停滞判据（-c http.lowSpeedLimit=1 -c http.lowSpeedTime=20）
          # 含一段**真 git** 对着本机"只连不传"桩源的 ≈20 秒判死断言（不出外网，CI 可跑）
          node tests/test-git-stall-guard.mjs
          # 批次 A-②（2026-09-27）：git 通道独立预算（默认 120 秒、可配、不得超过作业剩余预算）
          node tests/test-git-budget.mjs
          # 批次 A-②/③ 的真实验收：本机"只连不传"桩源 + **真 pnpm/git**，断言 git 预算到点停手、
          # 且展开出来的下一个候选照旧被尝试（15.6 秒收尾；不需要外网）
          node tests/test-real-git-budget.mjs
          # 批次 A-③：懒惰展开的位置（registry 通道之后、git 通道之前）+ 根包 private 时禁 git
          node tests/test-expand-order.mjs
          # 批次 A-④/⑤：通道 0 异常不短路 + release 预算跳过必须可见
          node tests/test-channel-robustness.mjs
          # 批次 B-⑥：读子包用 meta.default_branch 打头（dev/main/master 三分支都覆盖）
          node tests/test-subpackage-branch.mjs
          # 批次 B-⑦：探活判据（GET info/refs + pkt-line 校验）+ 探活失败降级到最后一轮 + 加速器归因
          node tests/test-probe-alive.mjs
          # 批次 B-⑧：报错带上「本次收到多少字节」（0 B = 只连不传；有字节 = 慢但在传）
          node tests/test-clone-bytes.mjs
          # 批次 C-⑨：archive 通道（HTTP 压缩包替代 git 协议；本机真网络由 test-real-archive 覆盖）
          node tests/test-archive-channel.mjs
          # 0.5.19 套装链修复：根克隆失败必须回落普通通道 + 套装判定前先看根包（子包）是否已发布。
          # 本套的 ③′ 段需要外网（真调 dsh-web 的判据）→ 这一步带 DSH_TEST_SKIP_NETWORK=1，
          # 它会如实打印 SKIP 原因（不假装 PASS）；其余各段只用到本机 git/pnpm/裸仓库，确定性可跑。
          node tests/test-suite-fallback.mjs
          # 批次 C-⑩：已落地仓库优先复用（克隆前先看 reposDir，命中就不发网络请求）
          node tests/test-landed-reuse.mjs
          # 批次 D-①（2026-09-27 改错）：源码通道改按**仓库体积**判定（private 根不再一刀切禁 git）。
          # 全离线：①纯判据边界（恰好等于阈值 / 多 1 KB / 0 KB / 非法阈值）②env 夹取 ③探测成功·404·超时
          # + 缓存语义（成功才落缓存）④门禁落到 job（放行/禁/未知三种结局 + note 必须含尺寸与出路）
          # ⑤dsh-web 429 MB fixture **必须仍被禁** ⑥162 行边界矩阵（仓库×根包×子包×类型×探测）每行一条断言
          node tests/test-repo-size-gate.mjs
          # 批次 D-②/D-③（2026-09-27 加法）：稀疏/定向取源码 + 预设型子包按 preset 装配。
          # 全离线（真 git + 本机裸仓库）：稀疏骨架只落地目标子目录（graded//injector/ 必须缺席）、
          # 不支持时降级普通 clone（两条触发路径）、assemblePreset 的**默认只补不覆盖**语义、
          # git 规格装成"别的包名"必须被识破。80+ 断言。
          node tests/test-preset-source.mjs
          # 批次 D-③ 的**接线**验收：预设源码通道真的接进候选循环（顺序：… release → 冻结展开 →
          # 预设装配；预设成功时 git 一次都不调）；runInstallJob 全链路**绝不写补丁行/绝不声明依赖**
          # （否则补丁行指向不存在的模块 → 启动崩溃），预设真的落盘 + presetNote 含"新建会话时选择"；
          # 0.5.26 追加 F1：**用户点的那一件排最前**（点第三件就装第三件）+ 点名件已安装时如实报"已安装"。
          node tests/test-preset-channel-wiring.mjs
          # 0.5.26 改错+加法（F2/F3/F4，独立对抗式复核抓到）：预设装配**默认只补不覆盖**（与上游
          # install.ps1 语义一致：已存在 → 跳过），覆盖必须由用户显式点「覆盖该预设」→ 白名单动作
          # overwrite-preset（服务端自己重新取源码 + 改前整目录备份 + 写后读回核实 + **绝不接受客户端
          # 命令串**，任意命令仍 400 且零改动）；写盘前校验 agent.cordis.yml 结构（不合法就跳过不写，
          # 绝不把原本可用的预设写坏）；备份路径唯一（同一毫秒两次装配不再互相覆盖）。
          # 全离线：真 git + 本机裸仓库 + 真 runInstallJob / runSuggestedAction。
          node tests/test-preset-overwrite.mjs
          # 0.5.26 改错（D-⑥，真机验证发现的**第三个缺陷**）：**预设随包分发** —— 包已经装下来了、
          # 落地物里带着 agent.cordis.yml（真机 dsh-router-standard@0.3.0 的 release 资产就是这样：
          # 没有 main/exports，只有 preset/）时，旧行为把它当普通插件装：预设一个字节都没进
          # .agent-presets（用户拿不到东西），还给一个无入口的模块写了补丁行（2026-09-06 崩溃事故同族）。
          # 段内断言：三种包体形状的预设识别；装配落盘 + job 收口（只补不覆盖时 sha 不变 + 下发覆盖动作）；
          # runInstallJob 端到端**不写补丁行/不声明依赖**；**反例**（普通插件照旧写补丁行）。
          node tests/test-preset-in-package.mjs
          # 0.5.28 改错+加法（2026-09-27）：**预设机制迁移** —— 框架 0.1.7-rc.x 起预设不再靠目录发现
          # （@deepseek-ai/dsh-agent-presets 不在依赖图、注册表 definitions 是内存 Map、无任何 fs 调用），
          # 载体变成 profile `cordis.patch.yml` 里的 `preset-<id>` **声明行**（name: '@deepseek-ai/dsh-agent-preset'）。
          # 旧行为只往 .agent-presets 落文件 → 用户在选择器里**看不到预设**（官方桌面端「自定义」为空就是这么来的）、
          # 老会话 resume 报 Unknown agent preset。本套把新模块 preset-declare.js 的判据与落盘全部钉死（全离线）：
          # ① 行形状（id 前缀/模块名/config 五字段/缩进 10 空格）② 相对 ./x.mjs → file:/// 绝对 URL
          # （基准是 **profile 目录**而非预设目录；中文用户名百分号编码）③ 预设目录里不存在同名文件 → 原样保留不猜
          # ④ 幂等（同 id 同内容 → 一个字节都不写、不建备份）⑤ 更新（原地替换 + .bak-preset-<ts> 备份）
          # ⑥ 已是绝对路径/裸包名 → 一动不动；重复旧行 → 清掉多余的（否则注册表 Duplicate agent preset 直接抛）
          # ⑦ 顶层 [] 占位符被清（issue #7：[] 后跟条目是非法 YAML，启动直接崩）
          # ⑧ 读回核实逐字段比对（真解析回来）+ 被篡改/不一致/找不到行都必须判红
          # ⑨ 失败路径如实报（没给 profile / profile 目录不存在 / 预设目录不存在 / id 非法 / YAML 非法 / 写盘失败），
          #   文案**绝不**再说"新建会话时选择"，改说"文件已就位，但当前框架版本需要声明行"并给出出路
          # ⑩ assemblePreset 接线（给 patchPath 就声明、不给就一个字节都不写）+ 声明抛异常不把装配带崩
          node tests/test-preset-declare.mjs
          # 0.5.29 改错+加法（**真机缺陷 D-⑦**：预设卡片红框「加载失败」）。
          # 真机错误原文（活体实例 /api/agentPresets/list 读回）：
          #   BROKEN  router-spec
          #           persona (@deepseek-ai/dsh-persona): invalid config:
          #             - $.prefix missing required value (at prefix)
          # 真根因：装配落盘的 agent.cordis.yml 里 persona 行写的是 `config.text`，而框架
          # @deepseek-ai/dsh-persona 的 Config 是 `prefix: z.string().required()`；框架 schema 读不到
          # text → 装配抛错 → 注册表把它吞成 record.broken → 卡片永远顶着框架自己的
          # brokenBadge「加载失败」。仓库**早就有** text→prefix 的迁移表，但它只在**框架升级**那一步跑，
          # 而预设还会经「装预设型子包 / 源码装配 / 手工放文件」落盘，那些路完全不过升级步骤。
          # 段内断言（全离线）：① persona 缺 prefix → 判红且点名行/包/键与框架会抛的原文
          # ② file:/// 目标不存在 → 判红；②′ 相对引用在预设目录里不存在 → 判红（**写行之前**就拦，
          # 不是"写完再读回判红"——那样已经写坏用户补丁）③ 行无 name / 空 composition → 判红
          # ④ **不误杀**：真机三预设的形状（CRLF / 块标量 persona / 空 config / 非 persona 的 text）全放行
          # ⑤ 迁移只动命中行、值一字不差、已有 prefix 绝不覆盖、非 persona 行的 text 不动
          # ⑥ 版本判据：低于引入版本不迁；**版本未知按最新处理**（否则又写出坏行，D-⑦ 现场正是如此）
          # ⑦ 接线：declarePresetRow 拒绝写坏行（ok:false + reason + detail + 补丁零字节改动）；
          #    真机形状写成且行里是 prefix、file: URL 改写正确、读回核实 6 项全过、二次声明幂等
          node tests/test-preset-rows.mjs

          # 0.5.30 批次（2026-09-28）四套新测试接入 CI —— 此前它们只在 tests/run-all.mjs 本机跑，
          # 等于没进门禁（本批新增的 preset-audit / patch-audit 路由被登记到 405 守卫之后，没人拦得住）。
          # 全部离线：纯判据 / 注入 IO / 私有 DSH_HOME（临时目录），不碰真实 profile、不用网络。
          # 路由级的方法契约另固化在 test-route-inventory.mjs（声明 GET 的路由必须住在 405 守卫之前）。
          node tests/test-compat-notice.mjs
          node tests/test-patch-composition-audit.mjs
          node tests/test-preset-audit.mjs
          node tests/test-framework-residuals.mjs

          # 2026-09-29 改错：非 win32 平台守卫 —— 「一键框架升级/回滚」通道依赖 schtasks.exe + PowerShell，
          # 旧行为在非 Windows 上先写 detached 状态文件、再 exec 不存在的 powershell.exe，**却仍回 ok:true**
          # （假成功）。本套用平台注入 + 注入 fetchJson 真跑路由：断言 501 拒绝、绝不 ok:true、零副作用
          # （备份/预禁用都没被调用、不写状态文件、不生成脚本）+ win32 判据放行（行为不变）。全离线。
          node tests/test-framework-upgrade-platform.mjs

          # 0.5.30 改错（**真机事故 2026-09-29 01:05:44**）：`healPatchSafety()` 误判「模块缺失」→ 自动禁用。
          # 现场：web profile 补丁尾部被追加 4 个 `disabled: true` 块（preset-router-spec /
          # workflow-worker-thread / preset-router-standard / preset-router-react），用户的 preset-router-* 三条被停掉。
          # 真因：自愈只用**单基准** `resolvePackageJson(name, profileDir)`，而框架 0.2.0-rc.1 起
          # `@deepseek-ai/*` 的实体全在 `.pnpm` **内部**那层 → 框架真存在的内置包（dsh-agent-preset /
          # dsh-workflow-ptc）被判成"缺失"。本套把它钉死（全离线：私有临时沙箱 + 自造桩包树）：
          # ① 多基准解析器（`.pnpm` 内层 / 「node_modules 本身」基准写法 / dirname×3 而非 ×2 的取层回归）
          # ② 单基准失败**不再**导致禁用（profile 顶层解析不到、框架树能解析 → 零写盘零禁用）
          # ③ 无缺失时**零写盘**（文件 SHA256 逐字节比对；GET /state 每 ≤2min 就调一次本函数）
          # ④ 真缺失时**仍如实禁用**（判据不许被修松）+ 框架自带包永不自动禁用 + 解析不确定只报告
          # ⑤ 写盘失败如实回报（written=false / writeError 带真因 / healedAt=0，不谎报"已修复"）
          # ⑥ 本机有真实 profile 时真调真机框架树（CI 无 profile 则**响亮 SKIP**，不假装 PASS）
          node tests/test-patch-heal-safety.mjs

          # ── 0.5.32 批次（2026-09-29）：**别的更新通道改了框架也要守住门** ──────────────────────
          # 用户诉求原话：「走别的更新通道（官方桌面端更新器 / 手动 pnpm / npx 缓存变化）改了框架后，
          # 我们仍要自动守门」+「有确证证据时自动禁用会拖垮服务的行」。四套（全离线、私有 DSH_HOME）：
          # ① D1 指纹变化 → 自动预检：同一指纹只跑一次、失败/超时如实报且**不阻塞状态查询**、
          #    指纹没变不下发上一个环境的结论；含**真实扫描器**（只读、不联网）的结构断言；
          # ② D2/D5：快照（原子写 / sha256 校验 / 保留 3 份 + 永不删"良好"）+ `restore-last-good`
          #    逐字节恢复且改前再备份 + `disable-suspects` 只动点名行（其余逐字节不变）+
          #    自动禁用只认确证证据（框架包/核心行/受保护行永不禁用、解析不确定不写盘、
          #    禁前先写快照、幂等零写盘、留可读记录、开关关闭只报告）；
          # ③ D4 桌面端宿主 → 自动拨回观察者（不抢手动 / 幂等零写盘 / 老记录按 manual 兼容）
          #    + **本机绝对路径与用户名 0 出现**的扫描断言（本轮 17 个文件，允许清单逐条写理由）；
          # ④ 路由契约（/safe-boot 白名单动作 + 新字段）另由 test-route-inventory 固化。
          node tests/test-auto-preflight.mjs
          node tests/test-safe-boot.mjs
          node tests/test-desktop-host-mode.mjs

          # ── 0.5.33 批次（2026-09-30）：四项「改错 + 加法」各自的硬门槛（全离线）──────────────────
          # ① 已删除 dsh-settings API 的扫描判据（真机误报：dshmarket 3 处命中全在注释 + 1 处 HTTP 载荷
