name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # CI 模式：跳过需要真实网络/本机 profile 的断言，避免环境因素误红
      DSH_TEST_SKIP_NETWORK: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Syntax check (hard gate)
        run: |
          node --check lib/index.js
          node --check lib/client.js
          for f in tests/test-*.mjs; do node --check "$f"; done

      - name: Unit tests (hard gate)
        run: |
          node tests/test-compat-gate.mjs
          node tests/test-compat-soft-lock.mjs
          node tests/test-preflight-guard.mjs
          node tests/test-format-preflight.mjs
          node tests/test-clean-residuals.mjs
          node tests/test-quarantine-merge.mjs
          node tests/test-route-inventory.mjs
          node tests/test-suite-detect.mjs
          node tests/test-format-contract.mjs
          node tests/test-framework-versions.mjs
          node tests/test-architecture-guard.mjs
          node tests/test-skill-toggle.mjs
          node tests/test-harness.mjs
          node tests/test-pnpm-kill-tree.mjs
          node tests/test-killtree-wait.mjs
          node tests/test-trash-fallback.mjs
          node tests/test-pnpm-env.mjs
          node tests/test-install-diagnose.mjs
          node tests/test-install-verify.mjs
          node tests/test-upgrade-script-blocks.mjs
          node tests/test-lockfile-health.mjs
          # 批次 A-①（2026-09-27）：git 克隆的停滞判据（-c http.lowSpeedLimit=1 -c http.lowSpeedTime=20）
          # 含一段**真 git** 对着本机"只连不传"桩源的 ≈20 秒判死断言（不出外网，CI 可跑）
          node tests/test-git-stall-guard.mjs
          # 批次 A-②（2026-09-27）：git 通道独立预算（默认 120 秒、可配、不得超过作业剩余预算）
          node tests/test-git-budget.mjs
          # 批次 A-②/③ 的真实验收：本机"只连不传"桩源 + **真 pnpm/git**，断言 git 预算到点停手、
          # 且展开出来的下一个候选照旧被尝试（15.6 秒收尾；不需要外网）
          node tests/test-real-git-budget.mjs
          # 批次 A-③：懒惰展开的位置（registry 通道之后、git 通道之前）+ 根包 private 时禁 git
          node tests/test-expand-order.mjs
          # 批次 A-④/⑤：通道 0 异常不短路 + release 预算跳过必须可见
          node tests/test-channel-robustness.mjs
          # 批次 B-⑥：读子包用 meta.default_branch 打头（dev/main/master 三分支都覆盖）
          node tests/test-subpackage-branch.mjs

      # 真装真卸冒烟：在 CI 的 Linux 宿主上跑（临时 DSH_HOME，不碰真实目录）。
      # 为什么单独一步且**不带** DSH_TEST_SKIP_NETWORK：环境相关测试"没 profile 就整体 SKIP"，
      # 正是这个缺口让 `git.exe`、corepack Windows 路径这类硬编码在 Linux CI 上一直活着（2026-09-20 复盘）。
      - name: Real install/uninstall smoke (temp DSH_HOME)
        env:
          DSH_TEST_SKIP_NETWORK: ''
        run: node tests/test-install-smoke.mjs

      - name: Environment-dependent tests (auto-SKIP without local profile)
        run: |
          node tests/test-framework-upgrade.mjs
          node tests/test-bundle-guard.mjs
          node tests/test-issue15-resolve.mjs
          node tests/test-suite-install.mjs
          node tests/test-registry-scan.mjs
          node tests/test-preset-migration.mjs
          node tests/test-upgrade-script-syntax.mjs
          node tests/test-preflight-disable.mjs
          # 真实 registry + 真 pnpm 的 lock 重建端到端（本步带 DSH_TEST_SKIP_NETWORK=1 → 会打印 SKIP + 原因，不假装 PASS）
          node tests/test-lockfile-repair.mjs
