name: npm-check

# 只读检查：用 GitHub 出口查 registry.npmjs.org 的版本与 dist-tags
# （本机到 npmjs 是黑洞时，用它核对发布结果）
on:
  workflow_dispatch:
    inputs:
      version:
        description: '可选：额外确认某个具体版本是否存在，如 0.3.63'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: dist-tags
        run: npm view @noob-stupid/dsh-plugin-console dist-tags --registry=https://registry.npmjs.org/
      - name: 最近版本列表
        run: npm view @noob-stupid/dsh-plugin-console versions --json --registry=https://registry.npmjs.org/ | tail -c 400
      - name: 指定版本是否存在
        if: ${{ inputs.version != '' }}
        run: |
          V="${{ inputs.version }}"
          # 只报告、不失败：核查"某版本是否已生效"时，未出现是正常中间态，不该让整个 run 变红（会刷 failed 通知）
          npm view "@noob-stupid/dsh-plugin-console@$V" version --registry=https://registry.npmjs.org/ \
            && echo "版本 $V 存在 ✅" || echo "版本 $V 暂未出现（未发布或仍在同步）❌——本步骤只报告，不判失败"
