name: downloads-badge

# npm 的 `downloads/point/*` 端点对本包返回 0（range 端点同周有数），所以徽章不能直接调它。
# 这里按 range 端点累加，写两份 JSON 供 shields 的 endpoint 徽章读取：
#   badges/downloads.json        近 7 天
#   badges/downloads-total.json  自首次发布起的累计
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: downloads-badge
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Recompute both download badges from the range endpoint
        run: |
          set -euo pipefail
          pkg='@noob-stupid/dsh-plugin-console'
          created='2026-08-21'
          week_start=$(node -e "console.log(new Date(Date.now()-6*864e5).toISOString().slice(0,10))")
          today=$(node -e "console.log(new Date().toISOString().slice(0,10))")

          sum() {
            curl -fsS --retry 3 --retry-delay 2 \
              "https://api.npmjs.org/downloads/range/$1:$2/${pkg}" |
              node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);console.log((j.downloads||[]).reduce((a,x)=>a+(x.downloads||0),0))})"
          }

          week=$(sum "$week_start" "$today")
          total=$(sum "$created" "$today")
          echo "week ${week_start}..${today} -> ${week}"
          echo "total ${created}..${today} -> ${total}"

          # 窗口内全 0 视为上游统计掉了数据：保留上一份，不把好数字擦成 0
          write() {
            node -e "
              const fs=require('fs');
              fs.writeFileSync(process.argv[1], JSON.stringify({
                schemaVersion: 1, label: process.argv[2], message: process.argv[3], color: 'blue'
              }, null, 2) + '\n');
            " "$1" "$2" "$3"
          }
          if [ "$week" = "0" ]; then echo "::warning::近一周全 0，保留旧值"; else write badges/downloads.json 'downloads' "${week}/week"; fi
          if [ "$total" = "0" ]; then echo "::warning::累计为 0，保留旧值"; else write badges/downloads-total.json 'downloads total' "${total}"; fi
      - name: Commit when a number changed
        run: |
          set -euo pipefail
          if git diff --quiet -- badges/; then echo "没有变化"; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add badges/
          git commit -m "chore: refresh the download badges"
          git push
