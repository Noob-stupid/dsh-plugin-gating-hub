name: downloads-badge

# npm 的 `downloads/point/*` 端点对本包返回 0（range 端点同周有数），所以徽章不能直接调它。
# 这里按 range 端点逐日累加出「近 7 天」，写进 badges/downloads.json，由 shields 的 endpoint 徽章读取。
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: downloads-badge
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compute last-7-day downloads from the range endpoint
        run: |
          set -euo pipefail
          pkg='@noob-stupid/dsh-plugin-console'
          # 用节点算日期，避免时区/格式踩坑
          start=$(node -e "const d=new Date(Date.now()-6*864e5);console.log(d.toISOString().slice(0,10))")
          end=$(node -e "console.log(new Date().toISOString().slice(0,10))")
          url="https://api.npmjs.org/downloads/range/${start}:${end}/${pkg}"
          json=$(curl -fsS --retry 3 --retry-delay 2 "$url")
          total=$(printf '%s' "$json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const n=(j.downloads||[]).reduce((a,x)=>a+(x.downloads||0),0);console.log(n)})")
          echo "range ${start}..${end} → ${total}"
          # 全 0 时不写盘：那是上游统计掉了数据，不是真的没人用（不编造也不把好数字擦成 0）
          if [ "$total" = "0" ]; then echo "::warning::range 窗口内全为 0，保留上一份数据"; exit 0; fi
          mkdir -p badges
          node -e "
            const fs=require('fs');
            fs.writeFileSync('badges/downloads.json', JSON.stringify({
              schemaVersion: 1, label: 'downloads', message: process.argv[1] + '/week', color: 'blue'
            }, null, 2) + '\n');
          " "$total"
      - name: Commit when the number changed
        run: |
          set -euo pipefail
          if git diff --quiet -- badges/downloads.json; then echo "没有变化"; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add badges/downloads.json
          git commit -m "chore: refresh the weekly download count"
          git push
